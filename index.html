<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Planilla Morada AR</title>
    <style>
        /* Diseño base de pantalla completa */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: Arial, sans-serif; }
        
        /* CÁMARA NATIVA: Forzada a ocupar el fondo real de la pantalla */
        #webcam { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; transform: scaleX(1); }
        
        /* CAPA 3D: Transparente y superpuesta exactamente arriba del video */
        #capa-ar { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        
        /* Interfaz de bienvenida flotante (Adaptada para adultos mayores) */
        #pantalla-inicio {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #4a148c, #7b1fa2);
            z-index: 9999; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: white; text-align: center; padding: 24px; box-sizing: border-box;
        }
        .btn-activar {
            background-color: #00e676; color: #000; font-size: 18px; font-weight: bold;
            padding: 16px 32px; border: none; border-radius: 30px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); margin-top: 25px;
        }
        .instrucciones {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(74, 20, 140, 0.9); color: white; padding: 12px 24px;
            border-radius: 25px; font-size: 14px; text-align: center; z-index: 999;
            width: 80%; max-width: 300px; font-weight: bold; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
    <!-- Cargamos únicamente el motor 3D ligero -->
    <script src="https://aframe.io"></script>
</head>
<body>

    <!-- Pantalla de Bienvenida -->
    <div id="pantalla-inicio">
        <h2 style="margin: 0 0 10px 0; font-size: 28px;">Planilla Morada</h2>
        <p style="font-size: 16px; max-width: 290px; margin: 0 0 15px 0; line-height: 1.4;">Propuestas de campaña en Realidad Aumentada para el Sector Salud.</p>
        <p style="font-size: 13px; color: #e0e0e0; max-width: 260px; line-height: 1.3;">Al presionar el botón, selecciona "Permitir" si el teléfono solicita acceso a la cámara.</p>
        <button class="btn-activar" onclick="arrancarCampana()">VER PROPUESTAS</button>
    </div>

    <div id="guia-texto" class="instrucciones">
        Mueve tu celular para interactuar con las propuestas.
    </div>

    <!-- Video Nativo de la Cámara Ocupando el Fondo -->
    <video id="webcam" autoplay playsinline muted></video>

    <!-- Contenedor del Motor Gráfico 3D (Totalmente Transparente) -->
    <div id="capa-ar">
        <!-- Configuramos la escena para tener fondo transparente (color-space y de-facto canvas clear) -->
        <a-scene embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" style="background: transparent !important;">
            
            <a-assets>
                <img id="foto" src="./assets/mi-foto.png">
                <img id="prop1" src="./assets/propuesta1.png">
                <img id="prop2" src="./assets/propuesta2.png">
            </a-assets>

            <!-- Tus elementos flotando a una distancia perfecta de lectura (2.2 metros) -->
            
                <!-- Tu fotografía principal -->
                <a-image src="#foto" position="0 0.5 0" width="1.1" height="1.4"></a-image>
                
                <!-- Propuesta Principal abajo de la foto -->
                <a-image src="#prop1" position="0 -0.5 0" width="1.6" height="0.45"></a-image>

                <!-- Segunda Propuesta inclinada hacia el lado derecho -->
                <a-image src="#prop2" position="1.7 0.0 -0.3" rotation="0 -30 0" width="1.4" height="0.45"></a-image>
            

            <!-- Cámara Virtual del mundo 3D fija con controles básicos de orientación -->
            
        </a-scene>
    </div>

    <script>
        function arrancarCampana() {
            const video = document.getElementById('webcam');
            
            // Forzar de forma nativa e infalible la solicitud de cámara del navegador móvil
            navigator.mediaDevices.getUserMedia({ 
                video: { 
                    facingMode: 'environment', // Obligar a usar la cámara trasera
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }, 
                audio: false 
            })
            .then(function(stream) {
                // Asignamos el flujo de video directo a nuestra etiqueta de fondo
                video.srcObject = stream;
                video.play();
                
                // Ocultamos la bienvenida y mostramos la guía
                document.getElementById('pantalla-inicio').style.display = 'none';
                document.getElementById('guia-texto').style.display = 'block';
            })
            .catch(function(err) {
                alert("Para vivir la experiencia de la Planilla Morada, por favor recarga la página y acepta el permiso de la cámara.");
                console.error("Error de cámara nativa: ", err);
            });
        }
    </script>
</body>
</html>
