<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Planilla Morada AR</title>
    
    <!-- Forzar pantalla completa e ignorar bloqueos de red externos -->
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: Arial, sans-serif; }
        
        /* CÁMARA REAL: Fondo absoluto */
        #webcam { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        
        /* ESCENARIO 3D INTERNO */
        #universo-ar { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
            display: flex; align-items: center; justify-content: center; pointer-events: none;
            perspective: 800px; /* Genera profundidad tridimensional nativa */
        }
        
        /* ROTADOR GIROSCÓPICO: Mueve los elementos al girar el cuerpo */
        #eje-movimiento {
            position: relative; width: 100%; height: 100%;
            transform-style: preserve-3d;
        }

        /* DISEÑO DE IMÁGENES EN 3D REAL */
        .propuesta-3d {
            position: absolute; top: 50%; left: 50%;
            backface-visibility: hidden;
            transform-style: preserve-3d;
            max-width: none;
        }

        /* Tu foto de campaña flotando al frente */
        #mi-foto {
            width: 160px; height: auto;
            transform: translate(-50%, -60%) translateZ(-350px);
        }

        /* Propuesta principal abajo de la foto */
        #propuesta-1 {
            width: 220px; height: auto;
            transform: translate(-50%, 65%) translateZ(-350px);
        }

        /* PROPUESTA 2 (Estilo Pokémon Go): Escondida a la DERECHA. Hay que girar el cuerpo 90 grados para verla */
        #propuesta-2 {
            width: 200px; height: auto;
            transform: translateX(350px) translateY(-50%) rotateY(-90deg);
        }

        /* Pantalla de bienvenida formal de la planilla */
        #pantalla-inicio {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #4a148c, #7b1fa2);
            z-index: 9999; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: white; text-align: center; padding: 24px; box-sizing: border-box;
        }
        .btn-activar {
            background-color: #00e676; color: #000; font-size: 18px; font-weight: bold;
            padding: 16px 32px; border: none; border-radius: 30px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); margin-top: 25px;
        }
        .instrucciones {
            position: fixed; bottom: 35px; left: 50%; transform: translateX(-50%);
            background: rgba(74, 20, 140, 0.95); color: white; padding: 12px 24px;
            border-radius: 25px; font-size: 14px; text-align: center; z-index: 999;
            width: 80%; max-width: 300px; font-weight: bold; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <!-- Pantalla de Bienvenida -->
    <div id="pantalla-inicio">
        <h2 style="margin: 0 0 10px 0; font-size: 28px;">Planilla Morada</h2>
        <p style="font-size: 16px; max-width: 290px; margin: 0 0 15px 0; line-height: 1.4;">Propuestas de campaña en Realidad Aumentada para el Sector Salud.</p>
        <p style="font-size: 13px; color: #e0e0e0; max-width: 260px; line-height: 1.3;">Para iniciar, presiona el botón y permite el uso de la cámara del dispositivo.</p>
        <button class="btn-activar" onclick="inicializarSistema()">VER PROPUESTAS</button>
    </div>

    <div id="guia-texto" class="instrucciones">
        Gira tu celular hacia la derecha para descubrir más propuestas.
    </div>

    <!-- Cámara de video nativa -->
    <video id="webcam" autoplay playsinline muted></video>

    <!-- Espacio 3D Matemático Puro (Cero dependencias externas) -->
    <div id="universo-ar">
        <div id="eje-movimiento">
            <img id="mi-foto" class="propuesta-3d" src="./assets/mi-foto.png" alt="Candidato">
            <img id="propuesta-1" class="propuesta-3d" src="./assets/propuesta1.png" alt="Propuesta 1">
            <img id="propuesta-2" class="propuesta-3d" src="./assets/propuesta2.png" alt="Propuesta 2">
        </div>
    </div>

    <script>
        function inicializarSistema() {
            const video = document.getElementById('webcam');
            
            // 1. Encender la cámara de forma nativa e infalible
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }, 
                audio: false 
            })
            .then(function(stream) {
                video.srcObject = stream;
                video.play();
                
                // 2. Desbloquear los sensores del giroscopio
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    // Ventana de seguridad para iPhones
                    DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        vincularSensores();
                    })
                    .catch(function(err) {
                        vincularSensores(); // Intentar en Android si falla
                    });
                } else {
                    // Android y navegadores comunes entran directo
                    vincularSensores();
                }

                document.getElementById('pantalla-inicio').style.display = 'none';
                document.getElementById('guia-texto').style.display = 'block';
            })
            .catch(function(err) {
                alert("Se requieren permisos de cámara para desplegar la experiencia.");
            });
        }

        function vincularSensores() {
            const eje = document.getElementById('eje-movimiento');
            
            // Leemos el movimiento real del giroscopio del teléfono
            window.addEventListener('deviceorientation', function(event) {
                if (event.alpha !== null) {
                    // El truco definitivo: Rotamos todo el universo 3D en sentido inverso al teléfono.
                    // Al mover el celular a la derecha, las imágenes se quedan quietas en el aire del cuarto.
                    eje.style.transform = 'rotateY(' + (-event.alpha) + 'deg)';
                }
            }, true);
        }
    </script>
</body>
</html>
