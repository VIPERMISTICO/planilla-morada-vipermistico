<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Planilla Morada AR</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: Arial, sans-serif; }
        
        /* CÁMARA REAL: Fondo absoluto de la pantalla */
        #webcam { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        
        /* VISOR AR: Ventana de recorte que esconde el contenido lateral */
        #visor-ar { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
            overflow: hidden; display: flex; align-items: center; justify-content: center; pointer-events: none;
        }
        
        /* LIENZO PANORÁMICO MÓVIL: Mide 3000px para que las propuestas queden FUERA de la pantalla */
        #lienzo-360 {
            position: absolute; width: 3000px; height: 100%;
            display: flex; align-items: center; justify-content: center;
            will-change: transform; transform: translateX(0px);
        }

        /* CONFIGURACIÓN GRÁFICA DE LAS IMÁGENES SEPARADAS */
        .bloque-campana {
            position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* 1. TU FOTO DE CAMPAÑA: Justo al frente en el centro exacto */
        #bloque-centro {
            left: 50%; transform: translateX(-50%); width: 260px;
        }
        #bloque-centro img { width: 160px; height: auto; border-radius: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }

        /* 2. PROPUESTA 1 (Escondida a la izquierda): Empujada a 900 píxeles fuera del teléfono */
        #bloque-izquierda {
            left: calc(50% - 900px); transform: translateX(-50%); width: 240px;
        }

        /* 3. PROPUESTA 2 (Escondida a la derecha): Empujada a 900 píxeles fuera del teléfono */
        #bloque-derecha {
            left: calc(50% + 900px); transform: translateX(-50%); width: 240px;
        }

        .tarjeta-propuesta { width: 100%; height: auto; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }

        /* Pantalla de Bienvenida */
        #pantalla-inicio {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #4a148c, #7b1fa2);
            z-index: 9999; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: white; text-align: center; padding: 24px; box-sizing: border-box;
        }
        .btn-activar {
            background-color: #00e676; color: #000; font-size: 18px; font-weight: bold;
            padding: 16px 32px; border: none; border-radius: 30px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); margin-top: 25px;
        }
        .instrucciones {
            position: fixed; bottom: 35px; left: 50%; transform: translateX(-50%);
            background: rgba(74, 20, 140, 0.95); color: white; padding: 12px 24px;
            border-radius: 25px; font-size: 14px; text-align: center; z-index: 999;
            width: 80%; max-width: 300px; font-weight: bold; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <!-- Pantalla de Bienvenida -->
    <div id="pantalla-inicio">
        <h2 style="margin: 0 0 10px 0; font-size: 28px;">Planilla Morada</h2>
        <p style="font-size: 16px; max-width: 290px; margin: 0 0 15px 0; line-height: 1.4;">Propuestas de campaña en Realidad Aumentada para el Sector Salud.</p>
        <p style="font-size: 13px; color: #e0e0e0; max-width: 260px; line-height: 1.3;">Presiona el botón para encender tu cámara y buscar tus propuestas.</p>
        <button class="btn-activar" onclick="inicializarSistema()">VER PROPUESTAS</button>
    </div>

    <div id="guia-texto" class="instrucciones">
        Gira tu cuerpo a los lados para buscar las propuestas en tu espacio.
    </div>

    <!-- Cámara trasera nativa -->
    <video id="webcam" autoplay playsinline muted></video>

    <!-- Escenario Realidad Aumentada Panorámico -->
    <div id="visor-ar">
        <div id="lienzo-360">
            
            <!-- CONTENIDO CENTRAL: Tu foto -->
            <div id="bloque-centro" class="bloque-campana">
                <img src="./assets/mi-foto.png" alt="Candidato">
                <p style="color: white; font-weight: bold; background: rgba(0,0,0,0.6); padding: 4px 12px; border-radius: 10px; margin-top: 8px;">Candidato</p>
            </div>
            
            <!-- CONTENIDO IZQUIERDO: Propuesta 1 (Oculta al iniciar) -->
            <div id="bloque-izquierda" class="bloque-campana">
                <img class="tarjeta-propuesta" src="./assets/propuesta1.png" alt="Propuesta 1">
            </div>

            <!-- CONTENIDO DERECHO: Propuesta 2 (Oculta al iniciar) -->
            <div id="bloque-derecha" class="bloque-campana">
                <img class="tarjeta-propuesta" src="./assets/propuesta2.png" alt="Propuesta 2">
            </div>

        </div>
    </div>

    <script>
        let inicioAlpha = null;

        function inicializarSistema() {
            const video = document.getElementById('webcam');
            
            // Encender cámara trasera nativa
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }, 
                audio: false 
            })
            .then(function(stream) {
                video.srcObject = stream;
                video.play();
                
                // Activar e inicializar los sensores de orientación física
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                    .then(permissionState => { if (permissionState === 'granted') vincularGiroscopio(); })
                    .catch(vincularGiroscopio);
                } else {
                    vincularGiroscopio();
                }

                document.getElementById('pantalla-inicio').style.display = 'none';
                document.getElementById('guia-texto').style.display = 'block';
            })
            .catch(function(err) {
                alert("Se requieren permisos de cámara para activar la experiencia.");
            });
        }

        function vincularGiroscopio() {
            const lienzo = document.getElementById('lienzo-360');
            
            window.addEventListener('deviceorientation', function(event) {
                if (event.alpha !== null) {
                    // Capturar la orientación inicial del médico al oprimir el botón
                    if (inicioAlpha === null) {
                        inicioAlpha = event.alpha;
                    }
                    
                    // Calcular cuántos grados se ha movido el celular respecto al inicio
                    let cambioAngulo = event.alpha - inicioAlpha;
                    
                    // Ajustar el ángulo entre -180 y 180 grados
                    if (cambioAngulo > 180) cambioAngulo -= 360;
                    if (cambioAngulo < -180) cambioAngulo += 360;
                    
                    // Conversión matemática: 1 grado de giro físico equivale a mover 12 píxeles la pantalla lateralmente.
                    // Al rotar el teléfono a la derecha, arrastramos el lienzo a la izquierda, logrando que la propuesta se quede "quieta" en el aire.
                    let desplazamientoPixeles = cambioAngulo * 12;
                    
                    lienzo.style.transform = 'translateX(' + desplazamientoPixeles + 'px)';
                }
            }, true);
        }
    </script>
</body>
</html>
