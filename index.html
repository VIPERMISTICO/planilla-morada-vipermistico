<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Planilla Morada AR</title>
    
    <!-- Forzar compatibilidad estricta con Safari e iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- Librerías de confianza en versiones ultra-compatibles -->
    <script src="https://aframe.io"></script>
    <script src="https://githack.com"></script>
    
    <style>
        /* Forzar que tanto el cuerpo como el video de la cámara ocupen el 100% real sin fallos */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: Arial, sans-serif; }
        video { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; object-fit: cover; z-index: -1; }
        
        /* Mensaje flotante adaptado para adultos mayores */
        .instrucciones {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(74, 20, 140, 0.9); color: white; padding: 14px 24px;
            border-radius: 25px; font-size: 15px; text-align: center; z-index: 9999;
            width: 80%; max-width: 320px; box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
            font-weight: bold; pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="instrucciones">
        Mueve tu celular despacio para ver las propuestas flotando.
    </div>

    <!-- La escena se escribe directa y limpia desde el inicio, sin trucos de JavaScript -->
    <a-scene embedded 
             arjs="sourceType: webcam; videoSettings: {facingMode: 'environment'}; debugUIEnabled: false;" 
             vr-mode-ui="enabled: false"
             renderer="logarithmicDepthBuffer: true; colorManagement: true;">
        
        <!-- Precarga de imágenes para evitar fallos de carga en red lenta -->
        <a-assets>
            <img id="foto" src="./assets/mi-foto.png">
            <img id="prop1" src="./assets/propuesta1.png">
            <img id="prop2" src="./assets/propuesta2.png">
        </a-assets>

        <!-- Elementos posicionados en el espacio frente al usuario (2.2 metros de distancia) -->
        
            
            <!-- Tu fotografía -->
            <a-image src="#foto" position="0 0.6 0" width="1.1" height="1.4"></a-image>
            
            <!-- Propuesta Principal abajo de la foto -->
            <a-image src="#prop1" position="0 -0.4 0" width="1.6" height="0.45"></a-image>

            <!-- Segunda Propuesta inclinada hacia el lado derecho -->
            <a-image src="#prop2" position="1.7 0.1 -0.4" rotation="0 -30 0" width="1.4" height="0.45"></a-image>
            
        

        <!-- Cámara de Realidad Aumentada nativa de AR.js -->
        
    </a-scene>

</body>
</html>
