<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Planilla Morada AR</title>
    
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: Arial, sans-serif; }
        
        /* CÁMARA REAL: Fondo absoluto */
        #webcam { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        
        /* ESCENARIO 3D INTERNO */
        #universo-ar { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
            display: flex; align-items: center; justify-content: center; pointer-events: none;
            perspective: 600px; /* Genera profundidad tridimensional */
        }
        
        /* ROTADOR GIROSCÓPICO: Gira todo el cuarto al mover el cuerpo */
        #eje-movimiento {
            position: relative; width: 100%; height: 100%;
            transform-style: preserve-3d;
            will-change: transform;
        }

        /* DISEÑO DE IMÁGENES EN MULTI-DIRECCIÓN */
        .propuesta-3d {
            position: absolute; top: 50%; left: 50%;
            backface-visibility: hidden;
            transform-style: preserve-3d;
            max-width: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 10px;
        }

        /* FOTO PRINCIPAL: Justo en el centro al frente */
        #mi-foto {
            width: 150px; height: auto;
            transform: translate(-50%, -60%) rotateY(0deg) translateZ(-350px);
        }

        /* PROPUESTA 1 (Pokémon Go Izquierda): Gira el celular un poco a la izquierda para leerla */
        #propuesta-1 {
            width: 200px; height: auto;
            transform: translate(-50%, -40%) rotateY(45deg) translateZ(-350px);
        }

        /* PROPUESTA 2 (Pokémon Go Derecha): Gira el celular un poco a la derecha para descubrirla */
        #propuesta-2 {
            width: 200px; height: auto;
            transform: translate(-50%, -40%) rotateY(-45deg) translateZ(-350px);
        }

        /* Interfaz de bienvenida */
        #pantalla-inicio {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #4a148c, #7b1fa2);
            z-index: 9999; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: white; text-align: center; padding: 24px; box-sizing: border-box;
        }
        .btn-activar {
            background-color: #00e676; color: #000; font-size: 18px; font-weight: bold;
            padding: 16px 32px; border: none; border-radius: 30px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); margin-top: 25px;
        }
        .instrucciones {
            position: fixed; bottom: 35px; left: 50%; transform: translateX(-50%);
            background: rgba(74, 20, 140, 0.95); color: white; padding: 12px 24px;
            border-radius: 25px; font-size: 14px; text-align: center; z-index: 999;
            width: 80%; max-width: 300px; font-weight: bold; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <!-- Pantalla de Bienvenida -->
    <div id="pantalla-inicio">
        <h2 style="margin: 0 0 10px 0; font-size: 28px;">Planilla Morada</h2>
        <p style="font-size: 16px; max-width: 290px; margin: 0 0 15px 0; line-height: 1.4;">Propuestas de campaña en Realidad Aumentada para el Sector Salud.</p>
        <p style="font-size: 13px; color: #e0e0e0; max-width: 260px; line-height: 1.3;">Presiona el botón para encender tu cámara y buscar el contenido flotando.</p>
        <button class="btn-activar" onclick="inicializarSistema()">VER PROPUESTAS</button>
    </div>

    <div id="guia-texto" class="instrucciones">
        Gira tu celular a los lados para descubrir las propuestas.
    </div>

    <!-- Video nativo -->
    <video id="webcam" autoplay playsinline muted></video>

    <!-- Espacio Virtual Circular -->
    <div id="universo-ar">
        <div id="eje-movimiento">
            <img id="mi-foto" class="propuesta-3d" src="./assets/mi-foto.png" alt="Candidato">
            <img id="propuesta-1" class="propuesta-3d" src="./assets/propuesta1.png" alt="Propuesta 1">
            <img id="propuesta-2" class="propuesta-3d" src="./assets/propuesta2.png" alt="Propuesta 2">
        </div>
    </div>

    <script>
        function inicializarSistema() {
            const video = document.getElementById('webcam');
            
            // Encender cámara
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }, 
                audio: false 
            })
            .then(function(stream) {
                video.srcObject = stream;
                video.play();
                
                // Activar sensores
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                    .then(permissionState => { vincularSensores(); })
                    .catch(function(err) { vincularSensores(); });
                } else {
                    vincularSensores();
                }

                document.getElementById('pantalla-inicio').style.display = 'none';
                document.getElementById('guia-texto').style.display = 'block';
            })
            .catch(function(err) {
                alert("Se requieren permisos de cámara para desplegar la experiencia.");
            });
        }

        function vincularSensores() {
            const eje = document.getElementById('eje-movimiento');
            
            window.addEventListener('deviceorientation', function(event) {
                if (event.alpha !== null) {
                    // Compensamos la rotación para dar el efecto Pokémon Go.
                    // Probamos el giro directo del ángulo para asegurar sincronía.
                    eje.style.transform = 'rotateY(' + event.alpha + 'deg)';
                }
            }, true);
        }
    </script>
</body>
</html>
