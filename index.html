<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Campaña Electoral AR</title>
    
    <!-- Forzar compatibilidad con iOS/Safari y Android modernos -->
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- Librerías estables de A-Frame y AR.js -->
    <script src="https://aframe.io"></script>
    <script src="https://githack.com"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; background-color: #000; }
        .instrucciones {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(106, 27, 154, 0.9); color: white; padding: 14px 24px;
            border-radius: 25px; font-size: 15px; text-align: center; z-index: 999;
            width: 80%; max-width: 320px; box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="instrucciones">
        Mueve tu celular despacio para ver las propuestas flotando en tu espacio.
    </div>

    <!-- Escena configurada rigurosamente para inicializar la Webcam correctamente -->
    <a-scene embedded 
             arjs="sourceType: webcam; videoSettings: {facingMode: 'environment'}; debugUIEnabled: false;" 
             vr-mode-ui="enabled: false">
        
        <!-- Contenedor con tus elementos de campaña flotando a una distancia cómoda (2 metros) -->
        
            
            <!-- Tu fotografía (Asegúrate de que exista assets/mi-foto.png) -->
            <a-image src="./assets/mi-foto.png" position="0 0.6 0" width="1.0" height="1.3"></a-image>
            
            <!-- Propuesta Principal abajo de la foto -->
            <a-image src="./assets/propuesta1.png" position="0 -0.4 0" width="1.5" height="0.4"></a-image>

            <!-- Segunda Propuesta inclinada a la derecha -->
            <a-image src="./assets/propuesta2.png" position="1.6 0.1 -0.3" rotation="0 -25 0" width="1.3" height="0.4"></a-image>
            
        

        <!-- Cámara nativa requerida por el motor AR.js -->
        
    </a-scene>

</body>
</html>
