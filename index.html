<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Planilla Morada AR</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: Arial, sans-serif; }
        
        /* Video nativo al fondo */
        #webcam { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        
        /* Capa 3D centrada en pantalla */
        #capa-ar { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        
        /* Pantalla de Bienvenida */
        #pantalla-inicio {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #4a148c, #7b1fa2);
            z-index: 9999; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: white; text-align: center; padding: 24px; box-sizing: border-box;
        }
        .btn-activar {
            background-color: #00e676; color: #000; font-size: 18px; font-weight: bold;
            padding: 16px 32px; border: none; border-radius: 30px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); margin-top: 25px;
        }
        .instrucciones {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(106, 27, 154, 0.9); color: white; padding: 12px 24px;
            border-radius: 25px; font-size: 14px; text-align: center; z-index: 999;
            width: 80%; max-width: 300px; font-weight: bold; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
    <script src="https://aframe.io"></script>
</head>
<body>

    <div id="pantalla-inicio">
        <h2 style="margin: 0 0 10px 0; font-size: 28px;">Planilla Morada</h2>
        <p style="font-size: 16px; max-width: 290px; margin: 0 0 15px 0; line-height: 1.4;">Propuestas de campaña en Realidad Aumentada para el Sector Salud.</p>
        <p style="font-size: 13px; color: #e0e0e0; max-width: 260px; line-height: 1.3;">Para una mejor experiencia, permite el uso de la cámara y los sensores de movimiento.</p>
        <button class="btn-activar" onclick="solicitarPermisos()">VER PROPUESTAS</button>
    </div>

    <div id="guia-texto" class="instrucciones">
        Gira tu celular para ver todas las propuestas.
    </div>

    <video id="webcam" autoplay playsinline muted></video>

    <div id="capa-ar">
        <a-scene embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" style="background: transparent !important;">
            
            <a-assets>
                <img id="foto" src="./assets/mi-foto.png">
                <img id="prop1" src="./assets/propuesta1.png">
                <img id="prop2" src="./assets/propuesta2.png">
            </a-assets>

            <!-- Este es el contenedor que va a girar con el giroscopio del celular -->
            
                
                    <!-- Tu foto principal al centro -->
                    <a-image src="#foto" position="0 0.5 0" width="1.1" height="1.4"></a-image>
                    
                    <!-- Propuesta Principal abajo -->
                    <a-image src="#prop1" position="0 -0.5 0" width="1.6" height="0.45"></a-image>

                    <!-- Segunda Propuesta a la derecha (Para verla deben girar el celular un poco) -->
                    <a-image src="#prop2" position="1.8 0.1 -0.4" rotation="0 -30 0" width="1.4" height="0.45"></a-image>
                
            

            
        </a-scene>
    </div>

    <script>
        function solicitarPermisos() {
            // 1. Activar la cámara nativa del celular
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
            .then(function(stream) {
                document.getElementById('webcam').srcObject = stream;
                
                // 2. Solicitar permisos de giroscopio (Especialmente obligatorio en iPhones)
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            activarGiroscopio();
                        } else {
                            // Si lo niegan, igual funciona pero se queda estático
                            activarGiroscopio(); 
                        }
                    })
                    .catch(console.error);
                } else {
                    // Android y teléfonos comunes no necesitan ventana extra, entran directo
                    activarGiroscopio();
                }

                document.getElementById('pantalla-inicio').style.display = 'none';
                document.getElementById('guia-texto').style.display = 'block';
            })
            .catch(function(err) {
                alert("Es necesario permitir la cámara para ver las propuestas.");
            });
        }

        function activarGiroscopio() {
            const contenedor = document.getElementById('contenedor-propuestas');
            
            // Escuchamos el movimiento real del teléfono
            window.addEventListener('deviceorientation', function(event) {
                // Obtenemos los grados de rotación (alrededor del eje vertical del celular)
                if (event.alpha !== null) {
                    // Sincronizamos de forma ultra suave las propuestas con el giro del usuario
                    contenedor.setAttribute('rotation', `0 ${event.alpha} 0`);
                }
            }, true);
        }
    </script>
</body>
</html>
